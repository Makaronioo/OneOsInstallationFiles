    </text>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">
      <rect x="930" y="276" width="290" height="44" rx="11" fill="#FFFFFF" fill-opacity=".05"/>
      <circle cx="953" cy="298" r="5.5" fill="#48E5B2"/>
      <text x="970" y="304" fill="#DCE6F3">OneOS</text>
      <text x="1192" y="304" fill="#8FA2BB" text-anchor="end">APK</text>

      <rect x="930" y="330" width="290" height="44" rx="11" fill="#FFFFFF" fill-opacity=".05"/>
      <circle cx="953" cy="352" r="5.5" fill="#60A5FA"/>
      <text x="970" y="358" fill="#DCE6F3">KernelSU</text>
      <text x="1192" y="358" fill="#8FA2BB" text-anchor="end">APK</text>

      <rect x="930" y="384" width="290" height="44" rx="11" fill="#FFFFFF" fill-opacity=".05"/>
      <circle cx="953" cy="406" r="5.5" fill="#A78BFA"/>
      <text x="970" y="412" fill="#DCE6F3">DFroot • DirtyFrag</text>
