<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="590" viewBox="0 0 1600 590" fill="none">
  <defs>
    <linearGradient id="bg" x1="120" y1="30" x2="1460" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#080D16"/>
    </linearGradient>
    <linearGradient id="accent" x1="150" y1="120" x2="700" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#48E5B2"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="card" x1="1015" y1="150" x2="1360" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D293A"/>
      <stop offset="1" stop-color="#111A28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(430 0 0 300 1230 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity=".25"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#8BA3C7" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1600" height="590" fill="url(#bg)"/>
  <rect width="1600" height="590" fill="url(#grid)"/>
  <rect width="1600" height="590" fill="url(#glow)"/>

  <!-- Dekoracyjne połączenia -->
  <g stroke="#48E5B2" stroke-opacity=".35" stroke-width="2">
    <path d="M590 112H760V180H900"/>
    <path d="M610 438H770V365H900"/>
    <path d="M1260 92V136"/>
    <path d="M1410 294H1490V365"/>
  </g>
  <g fill="#48E5B2">
    <circle cx="590" cy="112" r="5"/>
    <circle cx="610" cy="438" r="5"/>
    <circle cx="900" cy="180" r="5"/>
    <circle cx="900" cy="365" r="5"/>
    <circle cx="1260" cy="92" r="5"/>
    <circle cx="1490" cy="365" r="5"/>
  </g>

  <!-- Tło panelu -->
  <circle cx="1240" cy="294" r="205" fill="#2563EB" fill-opacity=".08"/>
  <circle cx="1240" cy="294" r="162" stroke="#5B8CFF" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="1240" cy="294" r="118" stroke="#48E5B2" stroke-opacity=".18" stroke-width="2"/>

  <!-- Ikona -->
  <g transform="translate(128 112)">
    <rect width="104" height="104" rx="26" fill="#142235" stroke="#48E5B2" stroke-opacity=".7" stroke-width="2"/>
    <path d="M28 36 52 22 76 36V65L52 80 28 65V36Z" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M52 22V51M28 36 52 51 76 36M52 51V80" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 91H64" stroke="#48E5B2" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Tytuł i opis -->
  <text x="128" y="286" fill="#F4F7FB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="750" letter-spacing="-2">
