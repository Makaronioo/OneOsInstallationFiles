  </text>

  <rect x="132" y="438" width="82" height="5" rx="2.5" fill="url(#accent)"/>
  <circle cx="140" cy="492" r="6" fill="#48E5B2"/>
  <text x="158" y="499" fill="#D7E1EF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500">
