    <path d="M902 158C902 143.64 913.64 132 928 132H1222C1236.36 132 1248 143.64 1248 158V184H902V158Z" fill="#FFFFFF" fill-opacity=".04"/>
    <circle cx="936" cy="158" r="5.5" fill="#FF6B6B"/>
    <circle cx="958" cy="158" r="5.5" fill="#F5C451"/>
